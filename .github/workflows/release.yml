name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build .exe
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v5
        with:
          name: pyhoma-windows
          path: Pyhoma-*.exe
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create "${{ github.ref_name }}" --title "Pyhoma. ${{ github.ref_name }}" --generate-notes }
          gh release upload "${{ github.ref_name }}" (Get-ChildItem Pyhoma-*.exe).FullName --clobber
